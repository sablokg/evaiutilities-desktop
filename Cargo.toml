[package]
name = "evai-gui"
version = "1.0.0"
edition = "2021"
authors = ["Gaurav Sablok <gsablok@proton.me>"]
description = "egui desktop application for the evAI variant/genome annotation utilities"
license = "MIT"
homepage = "https://github.com/sablokg/evaiutilities-desktop"
repository = "https://github.com/sablokg/evaiutilities-desktop"
keywords = ["bioinformatics","genomics","human"]


[lib]
name = "evai_gui"
path = "src/lib.rs"

[[bin]]
name = "evai-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.24", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
egui = "0.24"
rfd = "0.12"
rayon = "1.10"
cmd_lib = "1.9"
plotpy = "1.5"
# sqlx + tokio power the "Variant Database" (Postgres) command. They are
# deliberately NOT wired in by default here: sqlx's dependency tree moves
# fast and needs a reasonably recent Rust toolchain (1.80+). On your own
# machine, uncomment these two lines and re-enable the `database` feature
# below (and the `variantdatabase` module in src/lib.rs) to build it.
# sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres"] }
# tokio = { version = "1", features = ["full"] }

[features]
database = []

[profile.release]
opt-level = 3
